<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>test-front-end</title>

    <meta name="description" content="O econverse é uma plataforma de e-commerce que conecta compradores e vendedores, oferecendo uma experiência de compra online conveniente e segura.">
    <!-- Palavras-chave associadas ao site para mecanismos de busca -->
    <meta name="keywords" content="Tecnologia, E-commerce, Compras Online, Vendas Online, Plataforma de E-commerce, Marketplace, Loja Virtual, Comércio Eletrônico, Compras Seguras, Experiência de Compra Online">
    <!-- Identifica o autor ou empresa responsável pela criação da página -->
    <meta name="author" content="Gabriel">
    <!-- Instrução para os robôs do Google indexarem o site e seguirem seus links -->
    <meta name="robots" content="index, follow">
    <!-- Define a URL Canônica para evitar problemas de conteúdo duplicado no Google -->
    <link rel="canonical" href="https://econverse.vercel.app/">
    <!-- Define a cor da barra de navegação superior nos celulares (Safari/Chrome Mobile) -->
    <meta name="theme-color" content="#f3ebe3">

    <!-- Configurações do protocolo Open Graph para pré-visualização ao compartilhar no Facebook e WhatsApp -->
    <!-- Define que o tipo de conteúdo compartilhado é um site -->
    <meta property="og:type" content="website">
    <!-- Define o título que aparece ao compartilhar no Facebook e WhatsApp -->
    <meta property="og:title" content="ECONVERSE">
    <!-- Define o resumo que aparece ao compartilhar no Facebook e WhatsApp -->
    <meta property="og:description" content="O econverse é uma plataforma de e-commerce que conecta compradores e vendedores, oferecendo uma experiência de compra online conveniente e segura.">
    <!-- Define a imagem que aparece ao compartilhar no Facebook e WhatsApp -->
    <meta property="og:image" content="https://econverse.vercel.app/images/logo.png">
    <!-- Define a URL da página que aparece ao compartilhar no Facebook e WhatsApp -->
    <meta property="og:url" content="https://econverse.vercel.app/">
    <!-- [NOVO/MELHORIA]: Define o idioma regional das pré-visualizações nas redes sociais -->
    <meta property="og:locale" content="pt_BR">
    <!-- [NOVO/MELHORIA]: Especifica a largura ideal em pixels da imagem para o WhatsApp/Facebook carregar instantaneamente -->
    <meta property="og:image:width" content="1200">
    <!-- [NOVO/MELHORIA]: Especifica a altura ideal em pixels da imagem de compartilhamento -->
    <meta property="og:image:height" content="630">

    <!-- Configurações para pré-visualização ao compartilhar no Twitter / X -->
    <!-- Exibe a imagem de compartilhamento em formato grande -->
    <meta name="twitter:card" content="summary_large_image">
    <!-- Define o título que aparece ao compartilhar no Twitter / X -->
    <meta name="twitter:title" content="ECONVERSE">
    <!-- Define o resumo que aparece ao compartilhar no Twitter / X -->
    <meta name="twitter:description" content="O econverse é uma plataforma de e-commerce que conecta compradores e vendedores, oferecendo uma experiência de compra online conveniente e segura.">
    <!-- Define a imagem que aparece ao compartilhar no Twitter / X -->
    <meta name="twitter:image" content="https://econverse.vercel.app/images/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-straight/css/uicons-regular-straight.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
